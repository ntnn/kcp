# Secret that MATCHES the expression (tier In [frontend, backend]).
# Should be visible via the APIExport virtual workspace.
apiVersion: v1
kind: Secret
metadata:
  name: test-secret-frontend
  namespace: default
  labels:
    tier: frontend
type: Opaque
data:
  test: dGVzdA==
---
# Secret that MATCHES the expression (tier=backend).
# Should be visible via the APIExport virtual workspace.
apiVersion: v1
kind: Secret
metadata:
  name: test-secret-backend
  namespace: default
  labels:
    tier: backend
type: Opaque
data:
  test: dGVzdA==
---
# Secret that does NOT match the expression (tier=database is not in [frontend, backend]).
# Should NOT be visible via the APIExport virtual workspace.
apiVersion: v1
kind: Secret
metadata:
  name: test-secret-database
  namespace: default
  labels:
    tier: database
type: Opaque
data:
  test: dGVzdA==
