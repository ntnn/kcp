apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: today-cowboys
spec:
  resources:
  - name: cowboys
    group: wildwest.dev
    schema: today.cowboys.wildwest.dev
    storage:
      crd: {}
  permissionClaims:
  - group: ""
    resource: configmaps
    verbs: ["*"]
  - group: ""
    resource: secrets
    verbs: ["*"]
  - group: ""
    resource: serviceaccounts
    verbs: ["*"]
  - group: rbac.authorization.k8s.io
    resource: clusterroles
    verbs: ["*"]
  - group: rbac.authorization.k8s.io
    resource: clusterrolebindings
    verbs: ["*"]
  - group: authorization.k8s.io
    resource: subjectaccessreviews
    verbs: ["*"]
  - group: authorization.k8s.io
    resource: localsubjectaccessreviews
    verbs: ["*"]
  - group: apis.kcp.io
    resource: apibindings
    verbs: ["*"]
  # Update identityHash below after the export gets its identity.
  - group: wild.wild.west
    resource: sheriffs
    identityHash: "20ac01850a9bd09c3c7bc5b61281c4b5bbab9c55ee55f2928e5716cc673cfb75"
    verbs: ["*"]
