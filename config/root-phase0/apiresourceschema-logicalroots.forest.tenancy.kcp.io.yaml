apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v261115-6da5b36f0.logicalroots.forest.tenancy.kcp.io
spec:
  group: forest.tenancy.kcp.io
  names:
    categories:
    - kcp
    kind: LogicalRoot
    listKind: LogicalRootList
    plural: logicalroots
    singular: logicalroot
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Alias for the first path segment of the tree
      jsonPath: .spec.rootPath
      name: Root Path
      type: string
    - description: Name of the root logical cluster
      jsonPath: .status.clusterName
      name: Cluster
      type: string
    - description: The current phase (e.g. Scheduling, Initializing, Ready, Deleting)
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: URL to access the root logical cluster
      jsonPath: .status.URL
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      description: |-
        LogicalRoot is the root of a workspace tree outside of the root workspace.
        It is backed by a logical cluster with a generated name.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          default: {}
          description: LogicalRootSpec holds the desired state of the LogicalRoot.
          properties:
            location:
              description: |-
                location constrains the shards the root logical cluster can be scheduled to.
                When empty an arbitrary shard is chosen.
              properties:
                selector:
                  description: selector is a label selector that filters workspace
                    scheduling targets.
                  properties:
                    matchExpressions:
                      description: matchExpressions is a list of label selector requirements.
                        The requirements are ANDed.
                      items:
                        description: |-
                          A label selector requirement is a selector that contains values, a key, and an operator that
                          relates the key and values.
                        properties:
                          key:
                            description: key is the label key that the selector applies
                              to.
                            type: string
                          operator:
                            description: |-
                              operator represents a key's relationship to a set of values.
                              Valid operators are In, NotIn, Exists and DoesNotExist.
                            type: string
                          values:
                            description: |-
                              values is an array of string values. If the operator is In or NotIn,
                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                              the values array must be empty. This array is replaced during a strategic
                              merge patch.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - key
                        - operator
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                        map is equivalent to an element of matchExpressions, whose key field is "key", the
                        operator is "In", and the values array contains only "value". The requirements are ANDed.
                      type: object
                  type: object
                  x-kubernetes-map-type: atomic
              type: object
            rootPath:
              description: |-
                rootPath is an alias for the first path segment of the tree.
                When empty the tree is addressed by status.clusterName.

                Logical cluster names take precedence over root paths.
                Root paths are not claimed across shards.
                Setting it requires the LogicalRootAllowCustomNames feature gate.
              maxLength: 63
              pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
              type: string
              x-kubernetes-validations:
              - message: rootPath is immutable
                rule: self == oldSelf
              - message: rootPath is reserved
                rule: '!(self in [''root'', ''system'', ''user''])'
            type:
              description: |-
                type is the WorkspaceType of the root logical cluster.
                It must not allow a parent.
                When empty the type root in the root workspace is used.
              properties:
                name:
                  description: name is the name of the WorkspaceType
                  pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?
                  type: string
                path:
                  description: path is an absolute reference to the workspace that
                    owns this type, e.g. root:org:ws.
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(:[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
              required:
              - name
              type: object
              x-kubernetes-validations:
              - message: type is immutable
                rule: self == oldSelf
          type: object
          x-kubernetes-validations:
          - message: rootPath is immutable
            rule: has(oldSelf.rootPath) == has(self.rootPath)
          - message: type is immutable
            rule: has(oldSelf.type) == has(self.type)
        status:
          description: LogicalRootStatus communicates the observed state of the LogicalRoot.
          properties:
            URL:
              description: URL is the address under which the root logical cluster
                can be reached.
              type: string
            clusterName:
              description: clusterName is the generated name of the root logical cluster.
              type: string
            conditions:
              description: conditions is the current processing state of the LogicalRoot.
              items:
                description: Condition defines an observation of a object operational
                  state.
                properties:
                  lastTransitionTime:
                    description: |-
                      Last time the condition transitioned from one status to another.
                      This should be when the underlying condition changed. If that is not known, then using the time when
                      the API field changed is acceptable.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      A human readable message indicating details about the transition.
                      This field may be empty.
                    type: string
                  reason:
                    description: |-
                      The reason for the condition's last transition in CamelCase.
                      The specific API may choose whether or not this field is considered a guaranteed API.
                      This field may not be empty.
                    type: string
                  severity:
                    description: |-
                      Severity provides an explicit classification of Reason code, so the users or machines can immediately
                      understand the current situation and act accordingly.
                      The Severity field MUST be set only when Status=False.
                    type: string
                  status:
                    description: Status of the condition, one of True, False, Unknown.
                    type: string
                  type:
                    description: |-
                      Type of condition in CamelCase or in foo.example.com/CamelCase.
                      Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                      can be useful (see .node.status.conditions), the ability to deconflict is important.
                    type: string
                required:
                - lastTransitionTime
                - status
                - type
                type: object
              type: array
            initializers:
              description: |-
                initializers must be cleared by a controller
                before the root logical cluster is ready.
              items:
                description: |-
                  LogicalClusterInitializer is a unique string corresponding to a logical cluster
                  initialization controller.
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(:[a-z0-9]([-a-z0-9]*[a-z0-9])?)*(:[a-z0-9][a-z0-9]([-a-z0-9]*[a-z0-9])?))|(system:.+)$
                type: string
              type: array
            phase:
              default: Scheduling
              description: phase of the root logical cluster (Scheduling, Initializing,
                Ready).
              enum:
              - Scheduling
              - Initializing
              - Ready
              - Unavailable
              - Inactive
              - Terminating
              - Deleting
              type: string
            terminators:
              description: |-
                terminators must be cleared by a controller
                before the root logical cluster is deleted.
              items:
                description: |-
                  LogicalClusterTerminator is a unique string corresponding to a logical cluster
                  terminator controller.
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(:[a-z0-9]([-a-z0-9]*[a-z0-9])?)*(:[a-z0-9][a-z0-9]([-a-z0-9]*[a-z0-9])?))|(system:.+)$
                type: string
              type: array
          type: object
      type: object
    served: true
    storage: true
    subresources:
      status: {}
